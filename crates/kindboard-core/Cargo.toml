[package]
name = "kindboard-core"
version = "0.1.8"
edition = "2024"
license = "MIT"
description = "UI-free orchestration library for kindboard: kind cluster lifecycle, provisioning, topology and persistence"

[lib]
name = "kindboard_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
log = "0.4"
dirs = "7"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
secrecy = "0.10"

# Unix-only: process groups / killpg / waitpid (nix has no Windows support;
# ADR-0019).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
