# Keep Cargo.lock and pinned GitHub Actions current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependency digests for downloaded tools are pinned inside
    # crates/kindboard-core/src/deps/registry.rs (not in Cargo.toml) and
    # are updated as part of normal dependency-upgrade PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
