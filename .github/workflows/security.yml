# kindboard — supply-chain & security gates.
#
# Runs on every push/PR and weekly on a schedule:
#   1. cargo audit   RustSec advisory database (Cargo.lock, 503 deps)
#   2. cargo deny    licenses + bans + sources policy (deny.toml at repo root)
#   3. gitleaks      secret scanning (working tree + commit history)
#   4. dependency review — diffs PR dependencies against known-bad ecosystems
#
# These gates must stay green for a PR to merge. The scheduled run catches
# newly published advisories between releases.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # ref: v2
        with:
          args: --deny unmaintained --deny unsound --deny yanked

  cargo-deny:
    name: cargo deny (licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - name: Check dependencies against deny.toml
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # tag: v2
        with:
          command: check

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
        with:
          fetch-depth: 0 # full history — scan every past commit too
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # tag: v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # ref: v4
